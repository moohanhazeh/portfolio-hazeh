<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>포트폴리오</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">

    <!-- 흰 큰 카드 -->
    <section class="sheet">

      <!-- 왼쪽: ABOUT ME -->
      <aside class="about">
        <h2 class="section-label">ABOUT ME</h2>
        <div class="photo" id="profile-photo"></div>
        <h1 class="name" id="profile-name"></h1>
        <p class="job-title" id="profile-title"></p>
        <p class="badge" id="profile-badge"></p>

        <ul class="contact">
          <li>
            <span class="contact-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
            </span>
            <span id="contact-name"></span>
          </li>
          <li>
            <span class="contact-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
            </span>
            <span id="contact-email"></span>
          </li>
          <li>
            <span class="contact-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.2 15.2 0 006.6 6.6l2.2-2.2a1 1 0 011-.25 11.4 11.4 0 003.6.57 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.57a1 1 0 01-.25 1z"/></svg>
            </span>
            <span id="contact-phone"></span>
          </li>
          <li>
            <span class="contact-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 00-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
            </span>
            <span id="contact-location"></span>
          </li>
        </ul>
      </aside>

      <!-- 오른쪽: PORTFOLIO -->
      <div class="content">
        <h2 class="big-title">PORTFOLIO</h2>
        <p class="headline" id="profile-headline"></p>
        <p class="intro" id="profile-intro"></p>

        <div class="facts">
          <div class="fact">
            <h3 class="fact-title">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/></svg>
              EDUCATION
            </h3>
            <div class="fact-body" id="profile-education"></div>
          </div>
          <div class="fact">
            <h3 class="fact-title">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a4 4 0 00-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 005.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>
              SKILLS &amp; TOOLS
            </h3>
            <div class="fact-body" id="profile-skills"></div>
          </div>
          <div class="fact">
            <h3 class="fact-title">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2M3 13h18"/></svg>
              EXPERIENCE
            </h3>
            <div class="fact-body" id="profile-experience"></div>
          </div>
        </div>

        <div class="highlights">
          <h3 class="highlights-title">PORTFOLIO HIGHLIGHTS</h3>
          <div class="cards" id="cards">
            <p class="notice">불러오는 중…</p>
          </div>
        </div>

        <blockquote class="quote" id="profile-quote"></blockquote>
      </div>
    </section>

    <!-- 방명록 -->
    <section class="sheet guestbook">
      <h2 class="big-title">GUESTBOOK</h2>
      <div class="guest-form">
        <input type="text" id="guest-nickname" maxlength="20" placeholder="별명 (20자까지)">
        <input type="text" id="guest-message" maxlength="200" placeholder="한마디 남기기 (200자까지)">
        <button type="button" id="guest-submit">남기기</button>
      </div>
      <p class="guest-status" id="guest-status"></p>
      <ul class="guest-list" id="guest-list">
        <li class="notice">불러오는 중…</li>
      </ul>
    </section>

    <p class="admin-link"><a href="admin.html">관리자</a></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
